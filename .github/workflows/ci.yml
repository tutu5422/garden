name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same ref when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: true # lint warnings shouldn't block CI yet

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Minimal env for build — Next.js needs these to exist but values
          # can be placeholders for the build step (runtime env is used in prod).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_VPS_STORAGE_URL: https://placeholder.example.com/storage
          SITE_PASSWORD: placeholder-password
          SUPABASE_LOCAL_USER_ID: 00000000-0000-0000-0000-000000000000
