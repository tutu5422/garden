<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>测试</title>
<style>body{font-family:sans-serif;padding:20px;background:#f5f5f5}.btn{display:block;width:100%;padding:14px;margin:8px 0;font-size:16px;border:none;border-radius:8px;background:#47709B;color:#fff;cursor:pointer}.btn:active{opacity:0.7}.result{margin-top:16px;padding:12px;border-radius:8px;background:#fff;min-height:40px}</style>
</head>
<body>
<h2>手机端 JS 测试</h2>
<button class="btn" onclick="test('按钮点击 正常 ✅')">1. 点击我测试按钮</button>
<button class="btn" id="btn2">2. addEventListener 测试</button>
<button class="btn" id="btn3">3. 写 localStorage 测试</button>
<button class="btn" id="btn4">4. 读 localStorage 测试</button>
<div class="result" id="result">等待测试...</div>
<script>
document.getElementById('btn2').addEventListener('click', function(){
  document.getElementById('result').textContent = 'addEventListener 正常 ✅'
})
document.getElementById('btn3').addEventListener('click', function(){
  try {
    localStorage.setItem('test_key', 'hello')
    document.getElementById('result').textContent = 'localStorage 写入 正常 ✅'
  } catch(e) {
    document.getElementById('result').textContent = 'localStorage 失败 ❌: '+e.message
  }
})
document.getElementById('btn4').addEventListener('click', function(){
  var v = localStorage.getItem('test_key')
  document.getElementById('result').textContent = v ? 'localStorage 读取 正常 ✅ 值: '+v : '未找到值（先点按钮3）'
})
function test(msg) {
  document.getElementById('result').textContent = msg
}
</script>
</body>
</html>
